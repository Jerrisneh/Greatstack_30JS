<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launching Page</title>
    <link rel="stylesheet" href="/launchingPage/style.css">
</head>
<body>
    <div class="container">
        <img src="/launchingPage/images/logo.png" alt="logo" class="logo">
        <div class="content">
            <p>Website Is Under Maintenance</p>
            <h1>We are <span>Launching</span>  Soon</h1>
            <div class="launch-time">
                <div>
                    <p id="days">00</p>
                    <span>Days</span>
                </div>
                <div>
                    <p id="hours">00</p>
                    <span>Hours</span>
                </div>
                <div>
                    <p id="minutes">00</p>
                    <span>Minutes</span>
                </div>
                <div>
                    <p id="seonds">00</p>
                    <span>Seconds</span>
                </div>
            </div>
            <button type="button">Learn More <img src="/launchingPage/images/triangle.png" alt="btn"></button>

        </div>
        <img src="/launchingPage/images/rocket.png" class="rocket">
    </div>
    <script src="/launchingPage/index.js"></script>
</body>
</html>
